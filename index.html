<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--ac:#0a7aff;--ok:#1f9d55;--bad:#d93025;--bd:#e3e3e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989f;--ac:#4aa3ff;--ok:#34c759;--bad:#ff6961;--bd:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989f;--ac:#4aa3ff;--ok:#34c759;--bad:#ff6961;--bd:#2c2c2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:28px;margin:8px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.where{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:14px}
.where b{display:block;margin-bottom:8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--ac);text-decoration:none;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.card.done{opacity:.5}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:600}
.m{color:var(--mu);font-size:14px}
.amt{font-weight:700;white-space:nowrap}
.late{color:var(--bad);font-weight:600;font-size:13px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts a,.acts button{padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--ac);font-size:14px;text-decoration:none}
.acts .del{color:var(--bad)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:92%;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.panel label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.panel input,.panel select,.panel textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.two{display:flex;gap:8px}.two>div{flex:1}
.save{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;font-weight:600}
.cancel{width:100%;margin-top:6px;padding:10px;border:0;background:none;color:var(--mu);font-size:16px}
.hero{margin:-16px -16px 16px;padding:30px 20px 26px;background:linear-gradient(135deg,#6a5cff,#0a7aff 55%,#22c1c3);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 10px 30px rgba(10,122,255,.3);animation:drop .7s cubic-bezier(.2,.8,.2,1)}
.hero h1{margin:0;font-size:32px;letter-spacing:-.5px}
.hero p{margin:4px 0 0;opacity:.92;font-size:15px}
.card{border-left:5px solid var(--ac);box-shadow:0 2px 10px rgba(0,0,0,.06);animation:rise .55s both cubic-bezier(.2,.8,.2,1);transition:transform .2s,opacity .3s}
.card.pag{border-left-color:#ff9f0a}
.card:active{transform:scale(.98)}
.where{animation:rise .55s .1s both cubic-bezier(.2,.8,.2,1)}
.chips a{transition:transform .15s,background .2s}
.chips a:active{transform:scale(.92);background:var(--ac);color:#fff}
.tabs button{transition:all .25s}
.tabs button.on{box-shadow:0 4px 12px rgba(10,122,255,.35);transform:translateY(-1px)}
.fab{background:linear-gradient(135deg,#6a5cff,#0a7aff);animation:pop .6s .3s both cubic-bezier(.3,1.5,.5,1);transition:transform .25s}
.fab:active{transform:scale(.88) rotate(90deg)}
.sheet.open{animation:fade .25s}
.sheet.open .panel{animation:slide .4s cubic-bezier(.2,.8,.2,1)}
.late{animation:pulse 1.6s infinite}
.save{background:linear-gradient(135deg,#6a5cff,#0a7aff);transition:transform .15s}
.save:active{transform:scale(.97)}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="hero"><h1>La mia agenda</h1><p id="sub"></p></header>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">Tutto</button>
    <button data-f="app">Appuntamenti</button>
    <button data-f="pag">Pagamenti</button>
  </div>
  <div class="where">
    <b>Dove pagare vicino a te</b>
    <div class="chips" id="chips"></div>
  </div>
  <div id="list"></div>
</main>
<button class="fab" id="add" aria-label="Aggiungi">+</button>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2 style="margin:0">Nuovo elemento</h2>
    <label>Tipo</label>
    <select id="type"><option value="app">Appuntamento</option><option value="pag">Scadenza di pagamento</option></select>
    <label>Titolo</label>
    <input id="title" placeholder="Es. Dentista, Bolletta luce">
    <div class="two">
      <div><label>Data</label><input id="date" type="date"></div>
      <div><label>Ora</label><input id="time" type="time"></div>
    </div>
    <div id="amtWrap"><label>Importo (€)</label><input id="amount" type="number" inputmode="decimal" step="0.01" placeholder="0,00"></div>
    <label>Luogo (indirizzo o nome)</label>
    <input id="place" placeholder="Es. Poste Italiane, Via Roma 1">
    <label>Note</label>
    <textarea id="notes" rows="2"></textarea>
    <button class="save" id="save">Salva</button>
    <button class="cancel" id="cancel">Annulla</button>
  </div>
</div>

<script>
var KEY="agenda-v1",items=[],filter="all";
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function $(i){return document.getElementById(i)}
function mapUrl(q){return "https://maps.apple.com/?q="+encodeURIComponent(q)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

[["Ufficio postale","ufficio postale"],["Tabaccheria","tabaccheria"],["Banca","banca"],["Bancomat","bancomat"],["Supermercato","supermercato"]].forEach(function(c){
  var a=el("a",null,c[0]);a.href=mapUrl(c[1]);a.target="_blank";a.rel="noopener";$("chips").appendChild(a)});

function render(){
  var box=$("list");box.innerHTML="";
  var t=today();var od=items.filter(function(k){return !k.done&&k.date&&k.date<t}).length,up=items.filter(function(k){return !k.done}).length;$("sub").textContent=up?up+(up===1?" voce da fare":" voci da fare")+(od?" · "+od+(od===1?" scaduta":" scadute"):""):"Tutto in ordine ✨";
  var list=items.filter(function(i){return filter==="all"||i.type===filter});
  list.sort(function(a,b){return (a.done-b.done)||((a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))});
  if(!list.length){box.appendChild(el("div","empty","Niente da mostrare. Tocca + per aggiungere."));return}
  list.forEach(function(i,n){
    var c=el("div","card "+i.type+(i.done?" done":""));c.style.animationDelay=(n*60)+"ms";
    var r=el("div","row");
    var l=el("div");
    l.appendChild(el("div","t",(i.type==="pag"?"💶 ":"📅 ")+i.title));
    var d=new Date(i.date+"T00:00:00");
    var ds=isNaN(d)?"":d.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
    l.appendChild(el("div","m",ds+(i.time?" · "+i.time:"")));
    if(i.place)l.appendChild(el("div","m","📍 "+i.place));
    if(i.notes)l.appendChild(el("div","m",i.notes));
    if(!i.done&&i.date&&i.date<t)l.appendChild(el("div","late","Scaduto"));
    r.appendChild(l);
    if(i.type==="pag"&&i.amount)r.appendChild(el("div","amt",Number(i.amount).toLocaleString("it-IT",{style:"currency",currency:"EUR"})));
    c.appendChild(r);
    var a=el("div","acts");
    var q=i.place||(i.type==="pag"?"ufficio postale":"");
    if(q){var m=el("a",null,i.place?"Apri in Mappe":"Cerca dove pagare");m.href=mapUrl(q);m.target="_blank";m.rel="noopener";a.appendChild(m)}
    var f=el("button",null,i.done?"Riapri":(i.type==="pag"?"Pagato":"Fatto"));
    f.onclick=function(){i.done=!i.done;save();render()};a.appendChild(f);
    var x=el("button","del","Elimina");
    x.onclick=function(){items=items.filter(function(k){return k.id!==i.id});save();render()};a.appendChild(x);
    c.appendChild(a);box.appendChild(c);
  });
}

document.querySelectorAll("#tabs button").forEach(function(b){
  b.onclick=function(){filter=b.dataset.f;document.querySelectorAll("#tabs button").forEach(function(o){o.classList.toggle("on",o===b)});render()}});
function toggleAmt(){$("amtWrap").style.display=$("type").value==="pag"?"block":"none"}
$("type").onchange=toggleAmt;
$("add").onclick=function(){["title","date","time","amount","place","notes"].forEach(function(k){$(k).value=""});$("date").value=today();toggleAmt();$("sheet").classList.add("open")};
$("cancel").onclick=function(){$("sheet").classList.remove("open")};
$("save").onclick=function(){
  var title=$("title").value.trim();if(!title){$("title").focus();return}
  items.push({id:Date.now(),type:$("type").value,title:title,date:$("date").value,time:$("time").value,amount:$("amount").value,place:$("place").value.trim(),notes:$("notes").value.trim(),done:false});
  save();$("sheet").classList.remove("open");render()};
load();render();
</script>
</body>
</html>
