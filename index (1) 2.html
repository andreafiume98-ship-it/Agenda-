<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<title>Agenda</title>
<style>
:root{--bg:#f2f3f8;--card:#fff;--tx:#1c1c28;--mu:#707086;--ac:#5b5cf0;--ok:#1f9d55;--bad:#e5484d;--org:#ff9f0a;--bd:#e6e7f0;--sh:0 4px 16px rgba(40,40,90,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b12;--card:#17171f;--tx:#f3f3f8;--mu:#9a9ab0;--ac:#8587ff;--ok:#34c759;--bad:#ff6b70;--bd:#26263a;--sh:0 4px 16px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b0b12;--card:#17171f;--tx:#f3f3f8;--mu:#9a9ab0;--ac:#8587ff;--ok:#34c759;--bad:#ff6b70;--bd:#26263a;--sh:0 4px 16px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.hero{margin:-16px -16px 14px;padding:28px 20px 22px;background:linear-gradient(135deg,#7a5cff,#4f7cff 55%,#1fc8c3);color:#fff;border-radius:0 0 30px 30px;box-shadow:0 12px 30px rgba(79,124,255,.35);animation:drop .7s cubic-bezier(.2,.8,.2,1)}
.hero h1{margin:0;font-size:32px;letter-spacing:-.5px}
.hero p{margin:4px 0 14px;opacity:.92;font-size:15px}
.stats{display:flex;gap:10px}
.stat{flex:1;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:16px;padding:10px 12px}
.stat small{display:block;opacity:.85;font-size:12px}
.stat b{font-size:20px}
.cal{background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--sh);margin-bottom:14px;animation:rise .5s .05s both}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ch b{text-transform:capitalize}
.ch button{border:0;background:var(--bg);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:18px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.g .w{font-size:11px;color:var(--mu);padding:4px 0}
.g .d{position:relative;padding:8px 0 12px;border-radius:12px;font-size:14px;cursor:pointer;transition:background .2s,transform .15s}
.g .d:active{transform:scale(.9)}
.g .d.t{color:var(--ac);font-weight:700}
.g .d.s{background:var(--ac);color:#fff}
.g .dots{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:3px}
.g .dots i{width:5px;height:5px;border-radius:50%;background:var(--ac)}
.g .dots i.p{background:var(--org)}
.g .d.s .dots i{background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--card);padding:4px;border-radius:14px;box-shadow:var(--sh)}
.tabs button{flex:1;padding:9px;border:0;background:none;color:var(--mu);border-radius:11px;font-size:14px;font-weight:600;transition:all .25s}
.tabs button.on{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(91,92,240,.4)}
.where{margin-bottom:14px;animation:rise .5s .1s both}
.where b{display:block;margin-bottom:8px;font-size:13px;color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips a{flex:none;padding:7px 14px;border-radius:99px;background:var(--card);box-shadow:var(--sh);color:var(--ac);text-decoration:none;font-size:14px;transition:transform .15s}
.chips a:active{transform:scale(.92)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);border-left:5px solid var(--ac);animation:rise .55s both cubic-bezier(.2,.8,.2,1);transition:transform .2s,opacity .3s}
.card.pag{border-left-color:var(--org)}
.card.done{opacity:.5}
.card.done .t{text-decoration:line-through}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:700}
.m{color:var(--mu);font-size:14px}
.amt{font-weight:800;white-space:nowrap;font-size:17px}
.late{color:var(--bad);font-weight:700;font-size:13px;animation:pulse 1.6s infinite}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts a,.acts button{padding:7px 13px;border-radius:10px;border:0;background:var(--bg);color:var(--ac);font-size:14px;font-weight:600;text-decoration:none}
.acts .ok{background:var(--ok);color:#fff}
.acts .del{color:var(--bad)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.foot{display:flex;gap:8px;justify-content:center;margin-top:18px}
.foot button{border:0;background:var(--card);color:var(--mu);padding:8px 14px;border-radius:10px;font-size:13px;box-shadow:var(--sh)}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,#7a5cff,#4f7cff);color:#fff;font-size:32px;box-shadow:0 8px 20px rgba(79,124,255,.5);animation:pop .6s .3s both cubic-bezier(.3,1.5,.5,1);transition:transform .25s}
.fab:active{transform:scale(.88) rotate(90deg)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex;animation:fade .25s}
.panel{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px;max-height:92%;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:slide .4s cubic-bezier(.2,.8,.2,1)}
.panel label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.panel input,.panel select,.panel textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.two{display:flex;gap:8px}.two>div{flex:1}
.save{width:100%;margin-top:14px;padding:13px;border:0;border-radius:14px;background:linear-gradient(135deg,#7a5cff,#4f7cff);color:#fff;font-size:17px;font-weight:700}
.cancel{width:100%;margin-top:6px;padding:10px;border:0;background:none;color:var(--mu);font-size:16px}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1>La mia agenda</h1><p id="sub"></p>
    <div class="stats">
      <div class="stat"><small>Da pagare (30 giorni)</small><b id="due">€ 0</b></div>
      <div class="stat"><small>Scaduti</small><b id="od">0</b></div>
    </div>
  </header>
  <div class="cal">
    <div class="ch"><button id="prev">‹</button><b id="mt"></b><button id="next">›</button></div>
    <div class="g" id="grid"></div>
  </div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">Tutto</button>
    <button data-f="app">Appuntamenti</button>
    <button data-f="pag">Pagamenti</button>
  </div>
  <div class="where"><b>Dove pagare vicino a te</b><div class="chips" id="chips"></div></div>
  <div id="list"></div>
  <div class="foot">
    <button id="exp">Salva copia</button>
    <button id="imp">Ripristina copia</button>
  </div>
  <input type="file" id="file" accept="application/json,.json" style="display:none">
</main>
<button class="fab" id="add" aria-label="Aggiungi">+</button>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2 style="margin:0" id="ptitle">Nuovo elemento</h2>
    <label>Tipo</label>
    <select id="type"><option value="app">Appuntamento</option><option value="pag">Scadenza di pagamento</option></select>
    <label>Titolo</label>
    <input id="title" placeholder="Es. Dentista, Bolletta luce">
    <div class="two">
      <div><label>Data</label><input id="date" type="date"></div>
      <div><label>Ora</label><input id="time" type="time"></div>
    </div>
    <div id="payWrap">
      <label>Importo (€)</label><input id="amount" type="number" inputmode="decimal" step="0.01" placeholder="0,00">
      <label>Ripetizione</label>
      <select id="rep"><option value="">Una volta sola</option><option value="m">Ogni mese</option></select>
    </div>
    <label>Luogo (indirizzo o nome)</label>
    <input id="place" placeholder="Es. Poste Italiane, Via Roma 1">
    <label>Note</label>
    <textarea id="notes" rows="2"></textarea>
    <button class="save" id="save">Salva</button>
    <button class="cancel" id="cancel">Annulla</button>
  </div>
</div>

<script>
var KEY="agenda-v1",items=[],filter="all",sel=null,editId=null,cm=new Date();cm.setDate(1);
function load(){try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function $(i){return document.getElementById(i)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function mapUrl(q){return "https://maps.apple.com/?q="+encodeURIComponent(q)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return ymd(new Date())}
function eur(n){return Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"})}
function addMonth(s){var p=s.split("-").map(Number),n=new Date(p[0],p[1]-1,1);n.setMonth(n.getMonth()+1);var last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();return ymd(new Date(n.getFullYear(),n.getMonth(),Math.min(p[2],last)))}

[["Ufficio postale","ufficio postale"],["Tabaccheria","tabaccheria"],["Banca","banca"],["Bancomat","bancomat"],["Supermercato","supermercato"]].forEach(function(c){
  var a=el("a",null,c[0]);a.href=mapUrl(c[1]);a.target="_blank";a.rel="noopener";$("chips").appendChild(a)});

function calendar(){
  var g=$("grid");g.innerHTML="";
  $("mt").textContent=cm.toLocaleDateString("it-IT",{month:"long",year:"numeric"});
  ["L","M","M","G","V","S","D"].forEach(function(w){g.appendChild(el("div","w",w))});
  var off=(cm.getDay()+6)%7,n=new Date(cm.getFullYear(),cm.getMonth()+1,0).getDate(),t=today();
  for(var i=0;i<off;i++)g.appendChild(el("div"));
  for(var d=1;d<=n;d++){(function(d){
    var ds=ymd(new Date(cm.getFullYear(),cm.getMonth(),d));
    var c=el("div","d"+(ds===t?" t":"")+(ds===sel?" s":""),String(d));
    var day=items.filter(function(k){return k.date===ds&&!k.done});
    if(day.length){var dots=el("div","dots");
      if(day.some(function(k){return k.type==="app"}))dots.appendChild(el("i"));
      if(day.some(function(k){return k.type==="pag"}))dots.appendChild(el("i","p"));
      c.appendChild(dots)}
    c.onclick=function(){sel=(sel===ds?null:ds);render()};
    g.appendChild(c)})(d)}
}

function render(){
  var t=today(),lim=new Date();lim.setDate(lim.getDate()+30);lim=ymd(lim);
  var open=items.filter(function(k){return !k.done});
  var od=open.filter(function(k){return k.date&&k.date<t}).length;
  var due=open.filter(function(k){return k.type==="pag"&&k.date&&k.date<=lim}).reduce(function(s,k){return s+(Number(k.amount)||0)},0);
  $("due").textContent=eur(due);$("od").textContent=od;
  $("sub").textContent=open.length?open.length+(open.length===1?" voce da fare":" voci da fare"):"Tutto in ordine ✨";
  calendar();
  var box=$("list");box.innerHTML="";
  if(sel){var h=el("div","m","Giorno: "+new Date(sel+"T00:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})+" · tocca di nuovo il giorno per vedere tutto");h.style.margin="0 4px 10px";box.appendChild(h)}
  var list=items.filter(function(i){return (filter==="all"||i.type===filter)&&(!sel||i.date===sel)});
  list.sort(function(a,b){return (a.done-b.done)||((a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))});
  if(!list.length){box.appendChild(el("div","empty","Niente da mostrare. Tocca + per aggiungere."));return}
  list.forEach(function(i,n){
    var c=el("div","card "+i.type+(i.done?" done":""));c.style.animationDelay=(n*60)+"ms";
    var r=el("div","row"),l=el("div");
    l.appendChild(el("div","t",(i.type==="pag"?"💶 ":"📅 ")+i.title));
    var d=new Date(i.date+"T00:00:00");
    l.appendChild(el("div","m",(isNaN(d)?"":d.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"}))+(i.time?" · "+i.time:"")+(i.rep==="m"?" · 🔁 ogni mese":"")));
    if(i.place)l.appendChild(el("div","m","📍 "+i.place));
    if(i.notes)l.appendChild(el("div","m",i.notes));
    if(!i.done&&i.date&&i.date<t)l.appendChild(el("div","late","Scaduto"));
    r.appendChild(l);
    if(i.type==="pag"&&i.amount)r.appendChild(el("div","amt",eur(i.amount)));
    c.appendChild(r);
    var a=el("div","acts"),q=i.place||(i.type==="pag"?"ufficio postale":"");
    var f=el("button",i.done?"":"ok",i.done?"Riapri":(i.type==="pag"?"Pagato ✓":"Fatto ✓"));
    f.onclick=function(){
      i.done=!i.done;
      if(i.done&&i.rep==="m"&&i.date){var nx=JSON.parse(JSON.stringify(i));nx.id=Date.now();nx.date=addMonth(i.date);nx.done=false;items.push(nx);i.rep=""}
      save();render()};
    a.appendChild(f);
    if(q){var m=el("a",null,i.place?"Mappa":"Dove pagare");m.href=mapUrl(q);m.target="_blank";m.rel="noopener";a.appendChild(m)}
    var e=el("button",null,"Modifica");e.onclick=function(){openSheet(i)};a.appendChild(e);
    var x=el("button","del","Elimina");
    x.onclick=function(){if(confirm("Eliminare questa voce?")){items=items.filter(function(k){return k.id!==i.id});save();render()}};a.appendChild(x);
    c.appendChild(a);box.appendChild(c)});
}

document.querySelectorAll("#tabs button").forEach(function(b){
  b.onclick=function(){filter=b.dataset.f;document.querySelectorAll("#tabs button").forEach(function(o){o.classList.toggle("on",o===b)});render()}});
$("prev").onclick=function(){cm.setMonth(cm.getMonth()-1);calendar()};
$("next").onclick=function(){cm.setMonth(cm.getMonth()+1);calendar()};
function togglePay(){$("payWrap").style.display=$("type").value==="pag"?"block":"none"}
$("type").onchange=togglePay;
function openSheet(i){
  editId=i?i.id:null;$("ptitle").textContent=i?"Modifica":"Nuovo elemento";
  $("type").value=i?i.type:"app";
  ["title","date","time","amount","place","notes"].forEach(function(k){$(k).value=i?(i[k]||""):""});
  $("rep").value=i?(i.rep||""):"";
  if(!i)$("date").value=sel||today();
  togglePay();$("sheet").classList.add("open")}
$("add").onclick=function(){openSheet(null)};
$("cancel").onclick=function(){$("sheet").classList.remove("open")};
$("save").onclick=function(){
  var title=$("title").value.trim();if(!title){$("title").focus();return}
  var o={type:$("type").value,title:title,date:$("date").value,time:$("time").value,amount:$("amount").value,place:$("place").value.trim(),notes:$("notes").value.trim(),rep:$("type").value==="pag"?$("rep").value:""};
  if(editId){items.forEach(function(k){if(k.id===editId)Object.assign(k,o)})}
  else{o.id=Date.now();o.done=false;items.push(o)}
  save();$("sheet").classList.remove("open");render()};
$("exp").onclick=function(){try{
  var b=new Blob([JSON.stringify(items)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="agenda-copia.json";document.body.appendChild(a);a.click();a.remove()}catch(e){alert("Non riesco a salvare la copia.")}};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(ev){
  var f=ev.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var arr=JSON.parse(r.result);
    if(Array.isArray(arr)&&confirm("Sostituire l’agenda attuale con la copia?")){items=arr;save();render()}}catch(e){alert("File non valido.")}};
  r.readAsText(f);ev.target.value=""};
load();render();
</script>
</body>
</html>
